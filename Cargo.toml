[workspace]
members = [
    "watchapi-core",
    "watchapi-cli",
    "watchapi-gui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.4.0"

[workspace.dependencies]
anyhow = "1"
alacritty_terminal = "0.26.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
ctrlc = "3"
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
portable-pty = "0.8"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
regex = "1"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tray-icon = { version = "0.24", default-features = false }
unicode-normalization = "0.1"
url = "2"
wreq = { version = "6.0.0-rc.28", default-features = false, features = ["webpki-roots"] }
wreq-util = { version = "3.0.0-rc.11", default-features = false, features = ["emulation"] }
wry = "0.54.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.dev.package.boring-sys2]
opt-level = 1

[profile.test.package.boring-sys2]
opt-level = 1
